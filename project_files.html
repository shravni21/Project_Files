<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project Files</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #392F6C;
      --primary-light: #f5f2ff;
      --bg: #ffffff;
      --border: #e5e5ea;
      --text: #1c1c1e;
      --muted: #6b6b74;
      --success: #16803c;
      --error: #d93025;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px 60px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    /* Header */

    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 2rem;
      margin: 10px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 30px;
    }

    /* Upload */

    .upload-box {
      border: 2px dashed var(--primary);
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
      background: var(--primary-light);
    }

    .upload-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .upload-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .upload-description {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
      padding: 10px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 24px;
      background: var(--primary);
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      min-height: 20px;
      font-size: 0.9rem;
    }

    #status.success {
      color: var(--success);
    }

    #status.error {
      color: var(--error);
    }

    #status.pending {
      color: var(--muted);
    }

    /* Files */

    h2 {
      color: var(--primary);
      font-size: 1.25rem;
      margin: 35px 0 15px;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      transition: box-shadow 0.2s ease;
    }

    .file-card:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .file-info {
      min-width: 0;
      flex: 1;
    }

    .file-name {
      font-weight: 600;
      word-break: break-word;
      margin-bottom: 5px;
    }

    .file-meta {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
    }

    .delete-btn {
      background: #fff1f0;
      color: #d93025;
      border: 1px solid #ffd6d2;
    }

    .delete-btn:hover {
      background: #ffe4e1;
      opacity: 1;
    }

    .empty-msg,
    .loading-msg {
      text-align: center;
      color: var(--muted);
      padding: 25px 0;
    }

    /* Mobile */

    @media (max-width: 520px) {
      body {
        padding-top: 20px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .file-card {
        align-items: flex-start;
        flex-direction: column;
      }

      .file-actions {
        width: 100%;
      }

      .delete-btn {
        width: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📦 Project Files</h1>

    <div class="subtitle">
      Upload and share project files easily
    </div>

    <!-- Upload Section -->

    <div class="upload-box">

      <div class="upload-icon">📁</div>

      <div class="upload-title">
        Upload a ZIP file
      </div>

      <div class="upload-description">
        Select a project ZIP file and upload it.
      </div>

      <input type="file" id="fileInput" accept=".zip,application/zip">

      <button id="uploadBtn" type="button">
        Upload File
      </button>

      <div id="status"></div>

    </div>


    <!-- Files Section -->

    <h2>Available Files</h2>

    <div id="fileList" class="file-list">
      <div class="loading-msg">
        Loading files...
      </div>
    </div>

  </div>


  <script>

    // =========================================================
    // SUPABASE CONFIGURATION
    // =========================================================

    const SUPABASE_URL = "https://oajvyzyjyvpbzyjlubrb.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Mhsnw9M4IOBsfl9rHkkQyg_5798d1Ts";
    const BUCKET_NAME = "supabase_bucket";

    // Create Supabase client
    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // =========================================================
    // DOM ELEMENTS
    // =========================================================

    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");
    const fileListEl = document.getElementById("fileList");


    // =========================================================
    // STATUS MESSAGE
    // =========================================================

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = type;
    }


    // =========================================================
    // FORMAT FILE SIZE
    // =========================================================

    function formatBytes(bytes) {
      if (bytes === undefined || bytes === null || bytes === 0) {
        return "Unknown size";
      }

      const units = ["B", "KB", "MB", "GB"];
      let size = bytes;
      let index = 0;

      while (size >= 1024 && index < units.length - 1) {
        size /= 1024;
        index++;
      }

      return `${size.toFixed(size < 10 && index > 0 ? 1 : 0)} ${units[index]}`;
    }


    // =========================================================
    // FORMAT DATE
    // =========================================================

    function formatDate(dateString) {
      if (!dateString) return "";

      const date = new Date(dateString);
      if (isNaN(date.getTime())) return "";

      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }


    // =========================================================
    // UPLOAD FILE
    // =========================================================

    async function uploadFile() {
      const file = fileInput.files[0];

      if (!file) {
        setStatus("Please choose a ZIP file first.", "error");
        return;
      }

      if (!file.name.toLowerCase().endsWith(".zip")) {
        setStatus("Only ZIP files are allowed.", "error");
        return;
      }

      uploadBtn.disabled = true;
      setStatus(`Uploading "${file.name}"...`, "pending");

      const timestamp = Date.now();
      const storageFileName = `${timestamp}_${file.name}`;

      try {
        const { error } = await supabaseClient
          .storage
          .from(BUCKET_NAME)
          .upload(storageFileName, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: "application/zip"
          });

        if (error) throw error;

        setStatus("✓ File uploaded successfully!", "success");
        fileInput.value = "";
        await loadFiles();

      } catch (error) {
        console.error("Upload error:", error);
        setStatus(`Upload failed: ${error.message}`, "error");
      } finally {
        uploadBtn.disabled = false;
      }
    }


    // =========================================================
    // DELETE FILE
    // =========================================================

    async function deleteFile(fileName) {
      const displayName = fileName.replace(/^\d+_/, "");
      const confirmed = confirm(`Delete "${displayName}"? This cannot be undone.`);

      if (!confirmed) return;

      setStatus(`Deleting "${displayName}"...`, "pending");

      const { error } = await supabaseClient
        .storage
        .from(BUCKET_NAME)
        .remove([fileName]);

      if (error) {
        console.error("Delete error:", error);
        setStatus(`Delete failed: ${error.message}`, "error");
        return;
      }

      setStatus("✓ File deleted successfully!", "success");
      await loadFiles();
    }


    // =========================================================
    // LOAD FILES
    // =========================================================

    async function loadFiles() {
      fileListEl.innerHTML = `
        <div class="loading-msg">
          Loading files...
        </div>
      `;

      try {
        const { data, error } = await supabaseClient
          .storage
          .from(BUCKET_NAME)
          .list("", {
            limit: 1000,
            sortBy: {
              column: "created_at",
              order: "desc"
            }
          });

        if (error) throw error;

        // Filter out empty folder placeholders or root identifiers
        const files = (data || []).filter(
          file => file.name && file.name !== ".emptyFolderPlaceholder"
        );

        if (files.length === 0) {
          fileListEl.innerHTML = `
            <div class="empty-msg">
              No files uploaded yet.
            </div>
          `;
          return;
        }

        fileListEl.innerHTML = "";

        files.forEach(file => {
          const size = file.metadata?.size || null;
          const uploadedAt = file.created_at || file.metadata?.lastModified || null;
          const displayName = file.name.replace(/^\d+_/, "");

          const card = document.createElement("div");
          card.className = "file-card";

          const info = document.createElement("div");
          info.className = "file-info";

          const name = document.createElement("div");
          name.className = "file-name";
          name.textContent = `📦 ${displayName}`;

          const meta = document.createElement("div");
          meta.className = "file-meta";
          meta.textContent = `${formatBytes(size)}${uploadedAt ? " · " + formatDate(uploadedAt) : ""}`;

          info.appendChild(name);
          info.appendChild(meta);

          const actions = document.createElement("div");
          actions.className = "file-actions";

          // Download Action
          const downloadButton = document.createElement("button");
          downloadButton.type = "button";
          downloadButton.className = "action-btn";
          downloadButton.title = "Download";
          downloadButton.setAttribute("aria-label", `Download ${displayName}`);
          downloadButton.textContent = "⬇";

          downloadButton.addEventListener("click", async () => {
            try {
              downloadButton.disabled = true;
              downloadButton.textContent = "⏳";

              const { data: urlData, error: urlError } = await supabaseClient
                .storage
                .from(BUCKET_NAME)
                .createSignedUrl(file.name, 3600);

              if (urlError) throw urlError;
              if (!urlData?.signedUrl) throw new Error("Could not generate download URL.");

              const link = document.createElement("a");
              link.href = urlData.signedUrl;
              link.download = displayName;
              link.target = "_blank";
              link.rel = "noopener noreferrer";

              document.body.appendChild(link);
              link.click();
              link.remove();

            } catch (err) {
              console.error("Download error:", err);
              setStatus(`Download failed: ${err.message}`, "error");
            } finally {
              downloadButton.disabled = false;
              downloadButton.textContent = "⬇";
            }
          });

          // Delete Action
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "action-btn delete-btn";
          deleteButton.title = "Delete";
          deleteButton.setAttribute("aria-label", `Delete ${displayName}`);
          deleteButton.textContent = "🗑";

          deleteButton.addEventListener("click", () => {
            deleteFile(file.name);
          });

          actions.appendChild(downloadButton);
          actions.appendChild(deleteButton);

          card.appendChild(info);
          card.appendChild(actions);

          fileListEl.appendChild(card);
        });

      } catch (error) {
        console.error("Load files error:", error);
        fileListEl.innerHTML = `
          <div class="empty-msg">
            Could not load files.<br>
            <small>${escapeHtml(error.message)}</small>
          </div>
        `;
      }
    }


    // =========================================================
    // INITIALIZATION
    // =========================================================

    uploadBtn.addEventListener("click", uploadFile);

    // Initial load
    loadFiles();

  </script>

</body>

</html>
